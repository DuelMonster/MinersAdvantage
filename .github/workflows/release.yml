name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

jobs:
  build_and_publish:
    name: Build and publish all nodes
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'versions/**/*.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Build all Stonecutter nodes
        run: ./gradlew chiseledBuild --no-daemon

      - name: Stage release jars
        run: ./gradlew chiseledPackageRelease --no-daemon

      - name: Publish all publications to local repository
        run: ./gradlew chiseledPublishAllPublicationsToLocalRepository --no-daemon

      - name: Publish mods to platforms
        run: ./gradlew chiseledPublishMods --no-daemon

      - name: Read mod_version
        id: mod_version
        run: |
          echo "mod_version=$(grep -E '^mod_version=' gradle.properties | cut -d'=' -f2 | tr -d '\r')" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "MinersAdvantage v${{ steps.mod_version.outputs.mod_version }}"
          files: releases/*.jar
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
