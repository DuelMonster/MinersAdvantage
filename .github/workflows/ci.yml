name: CI

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx3G

jobs:
  build:
    name: Build all nodes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'versions/**/*.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Build all Stonecutter nodes
        run: ./gradlew chiseledBuild --no-daemon

      - name: Upload release jars
        uses: actions/upload-artifact@v4
        with:
          name: minersadvantage-jars
          path: versions/**/build/libs/*.jar
          if-no-files-found: warn
