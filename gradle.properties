# ─────────────────────────────────────────────────────────────
# Root Gradle properties
# Shared across ALL Stonecutter nodes (all loader×version combos).
# Loader-specific and MC-version-specific properties live in:
#   versions/<name>/gradle.properties
# ─────────────────────────────────────────────────────────────

# Mod version — the single source of truth.
# Bumped on each release day (minor +1 per user workflow rules).
mod_version=2.27.0

# Modrinth + CurseForge project IDs used by the publishing block.
# Fill in once the projects exist on the respective platforms.
modrinth_project_id=VcTmRh04
curseforge_project_id=291972

# ─── Gradle JVM / execution tuning ───────────────────────────
# Use JDK 25 (installed alongside JDK 21) so Modstitch 0.8.5 can load.
# Node targets are split by MC line in build.gradle.kts:
# - 1.21.x -> Java 21
# - 26.x   -> Java 25
# org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-25.0.2.10-hotspot
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# Parallel execution speeds up chiseledBuild across all nodes
org.gradle.parallel=true
org.gradle.workers.max=4
